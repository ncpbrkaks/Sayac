<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sayacımız</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .smoke-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at 50% 30%, #2a2a2a 0%, #121212 80%);
            opacity: 0.7;
            z-index: -1;
        }

        h1 {
            color: #4CAF50;
            font-size: 26px;
            margin: 10px 0 5px 0;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        }

        .subtitle {
            color: #888;
            font-size: 13px;
            margin: 0 0 10px 0;
        }

        .user-tag {
            background: #1e1e1e;
            border: 1px solid #333;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            color: #aaa;
            margin-bottom: 10px;
        }

        .user-tag span {
            color: #4CAF50;
            font-weight: bold;
        }

        .btn-add {
            background: linear-gradient(135deg, #4CAF50, #1b5e20);
            border: 2px solid #81c784;
            border-radius: 50%;
            width: 160px;
            height: 160px;
            color: white;
            font-size: 52px;
            font-weight: bold;
            margin: 20px 0;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(76, 175, 80, 0.35);
            transition: transform 0.1s;
            position: relative;
            outline: none;
        }

        .btn-add:active {
            transform: scale(0.92);
        }

        .leaderboard {
            width: 100%;
            max-width: 420px;
            background-color: rgba(30, 30, 30, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            border: 1px solid #333;
            padding: 12px;
            text-align: left;
            margin-top: 10px;
        }

        .user-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 14px;
            border-radius: 10px;
            margin-bottom: 8px;
            background: #1a1a1a;
            border: 1px solid #292929;
            transition: all 0.3s ease;
        }

        .user-row:last-child {
            margin-bottom: 0;
        }

        .rank-first {
            background: rgba(255, 60, 0, 0.12);
            border-left: 4px solid #ff3c00;
        }

        .rank-last {
            background: rgba(76, 175, 80, 0.12);
            border-left: 4px solid #4CAF50;
        }

        .user-info {
            display: flex;
            flex-direction: column;
        }

        .user-name {
            font-size: 17px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .user-quote {
            font-size: 12px;
            color: #999;
            margin-top: 4px;
            font-style: italic;
        }

        .score-container {
            display: flex;
            align-items: center;
        }

        .user-score {
            font-size: 26px;
            font-weight: 900;
            color: #ffffff;
            margin-left: 12px;
        }

        .rank-first .user-score { color: #ff5722; }
        .rank-last .user-score { color: #81c784; }

        /* Yönetici Silme Butonu */
        .admin-btn {
            background: #d32f2f;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 4px 10px;
            font-weight: bold;
            cursor: pointer;
            margin-left: 10px;
            font-size: 14px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
        .admin-btn:active { transform: scale(0.9); }

        #nameModal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 10, 10, 0.96);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        #nameModal input {
            padding: 14px;
            font-size: 18px;
            border-radius: 10px;
            border: 2px solid #4CAF50;
            width: 100%;
            max-width: 280px;
            text-align: center;
            margin-bottom: 16px;
            background: #1e1e1e;
            color: white;
            outline: none;
        }

        #nameModal button {
            padding: 12px 32px;
            font-size: 17px;
            border-radius: 10px;
            border: none;
            background: linear-gradient(135deg, #4CAF50, #2E7D32);
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .floating-emoji {
            position: absolute;
            font-size: 28px;
            pointer-events: none;
            animation: floatUp 1.2s ease-out forwards;
            z-index: 50;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-120px) scale(1.4); opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="smoke-bg"></div>

    <div id="nameModal">
        <h2 style="color:white; margin-bottom: 6px;">Sayaca Katıl</h2>
        <p style="color:#aaa; margin-bottom: 20px; font-size: 14px;">Grupta görüneceğin ismi yaz</p>
        <input type="text" id="nameInput" placeholder="Adın nedir?" autocomplete="off" maxlength="20">
        <button onclick="saveName()">Giriş Yap</button>
    </div>

    <h1>🚬 Günlük Sayaç</h1>
    <p class="subtitle">Herkesin içtiği anlık güncellenir</p>
    <div class="user-tag" id="userTag" style="display:none;">Giriş yapıldı: <span id="currentUserName"></span></div>

    <button class="btn-add" id="mainBtn" onclick="addSmoke()">+1</button>

    <div class="leaderboard" id="leaderboard">
        <p style="text-align:center; color:#777; margin: 10px 0;">Bağlantı kuruluyor...</p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
        import { getDatabase, ref, onValue, runTransaction, set, get } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA2-rUtVFadlncw_TPBK53qiLMVKhYKa6k",
            authDomain: "sayac-82f63.firebaseapp.com",
            databaseURL: "https://sayac-82f63-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "sayac-82f63",
            storageBucket: "sayac-82f63.firebasestorage.app",
            messagingSenderId: "210348694246",
            appId: "1:210348694246:web:d45a93372c2e406296f927"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const countersRef = ref(db, "counters");

        // Gizli yönetici kontrolü
        const urlParams = new URLSearchParams(window.location.search);
        const isAdmin = urlParams.get('admin') === 'patron';

        const quotesMax = [
            "Yakında egzoz muayenesine girecek 🚗💨",
            "Ciğeri ele almaya en yakın 💀",
            "Marlboro'nun gizli sponsoru 💸",
            "Yürüyen baca fabrikası 🏭",
            "Nefes almayı unuttu 😮‍💨"
        ];
        const quotesMin = [
            "Alet cam gibi maşallah 💎",
            "Sağlıklı yaşam gurusu 🧘‍♂️",
            "Ciğerler pembe pembe 🌸",
            "Deterjanla yıkanmış gibi 🧼",
            "Ortamın en temizi ✨"
        ];
        const quotesMid = [
            "Kendi halinde, ne az ne çok ⚖️",
            "Dengeyi bulmuş 🧘",
            "Sessiz ve derinden 🚬",
            "Keyifçi tayfadan ☕"
        ];

        let myName = localStorage.getItem("sayac_fb_name");
        let usersData = {};

        function sanitizeKey(name) {
            return name.replace(/[.#$[\]/]/g, "_");
        }

        if (myName) {
            document.getElementById("nameModal").style.display = "none";
            document.getElementById("userTag").style.display = "block";
            document.getElementById("currentUserName").innerText = myName;
        }

        window.saveName = async function() {
            const input = document.getElementById("nameInput").value.trim();
            if (input.length > 0) {
                myName = input;
                localStorage.setItem("sayac_fb_name", myName);
                document.getElementById("nameModal").style.display = "none";
                document.getElementById("userTag").style.display = "block";
                document.getElementById("currentUserName").innerText = myName;

                const userRef = ref(db, "counters/" + sanitizeKey(myName));
                const snapshot = await get(userRef);
                if (!snapshot.exists()) {
                    await set(userRef, { name: myName, count: 0, updated_at: Date.now() });
                }
            }
        };

        window.addSmoke = function() {
            if (!myName) return;
            createFloatingEmoji();

            const userRef = ref(db, "counters/" + sanitizeKey(myName));
            runTransaction(userRef, (currentData) => {
                if (currentData) {
                    currentData.count = (currentData.count || 0) + 1;
                    currentData.updated_at = Date.now();
                    return currentData;
                } else {
                    return { name: myName, count: 1, updated_at: Date.now() };
                }
            });

            if (navigator.vibrate) navigator.vibrate(40);
        };

        // Yöneticiler için skoru 1 düşürme fonksiyonu
        window.removeSmoke = function(targetName) {
            const userRef = ref(db, "counters/" + sanitizeKey(targetName));
            runTransaction(userRef, (currentData) => {
                if (currentData && currentData.count > 0) {
                    currentData.count -= 1;
                    currentData.updated_at = Date.now();
                }
                return currentData;
            });
        };

        function createFloatingEmoji() {
            const btn = document.getElementById("mainBtn");
            const rect = btn.getBoundingClientRect();
            const emoji = document.createElement("div");
            emoji.className = "floating-emoji";
            emoji.innerText = "💨";

            const randomX = rect.left + (Math.random() * rect.width);
            const randomY = rect.top + 10;

            emoji.style.left = randomX + "px";
            emoji.style.top = randomY + "px";
            document.body.appendChild(emoji);

            setTimeout(() => { emoji.remove(); }, 1200);
        }

        onValue(countersRef, (snapshot) => {
            const data = snapshot.val();
            usersData = data || {};
            renderLeaderboard();
        });

        function renderLeaderboard() {
            const board = document.getElementById("leaderboard");
            const userList = Object.values(usersData).filter(u => u && u.name);

            if (userList.length === 0) {
                board.innerHTML = '<p style="text-align:center; color:#777; margin: 10px 0;">Henüz kimse giriş yapmadı.</p>';
                return;
            }

            userList.sort((a, b) => (b.count || 0) - (a.count || 0));

            const maxCount = userList[0].count || 0;
            const minCount = userList[userList.length - 1].count || 0;

            board.innerHTML = "";

            userList.forEach((user, index) => {
                const count = user.count || 0;
                let quote = "";
                let icon = "🚬";
                let rowClass = "user-row";

                if (userList.length > 1 && count === maxCount && count > 0) {
                    quote = quotesMax[index % quotesMax.length];
                    icon = "🔥💀";
                    rowClass += " rank-first";
                } else if (userList.length > 1 && count === minCount) {
                    quote = quotesMin[index % quotesMin.length];
                    icon = "🌱";
                    rowClass += " rank-last";
                } else {
                    quote = quotesMid[index % quotesMid.length];
                }

                const adminBtnHtml = isAdmin ? `<button class="admin-btn" onclick="removeSmoke('${user.name}')">-1</button>` : '';

                const row = document.createElement("div");
                row.className = rowClass;
                row.innerHTML = `
                    <div class="user-info">
                        <div class="user-name">${icon} ${user.name}</div>
                        <div class="user-quote">${quote}</div>
                    </div>
                    <div class="score-container">
                        <div class="user-score">${count}</div>
                        ${adminBtnHtml}
                    </div>
                `;
                board.appendChild(row);
            });
        }
    </script>
</body>
</html>
