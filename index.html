<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Sayaç</title>
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #1C1C1E;
            --text-main: #FFFFFF;
            --text-muted: rgba(235, 235, 245, 0.6);
            --ios-green: #34C759;
            --ios-red: #FF3B30;
            --ios-blue: #0A84FF;
            --ios-orange: #FF9F0A;
            --separator: rgba(84, 84, 88, 0.65);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: env(safe-area-inset-top) 20px env(safe-area-inset-bottom) 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Apple Tarzı Arka Plan Işıltısı */
        .ambient-glow {
            position: fixed; top: -10%; left: -10%; width: 120vw; height: 50vh;
            background: radial-gradient(circle at 50% 0%, rgba(52, 199, 89, 0.15) 0%, transparent 70%);
            z-index: -1; pointer-events: none;
        }

        /* Üst Header Alanı */
        .header {
            width: 100%; max-width: 400px;
            display: flex; justify-content: space-between; align-items: flex-end;
            margin-top: 20px; padding-bottom: 15px;
        }
        .header h1 { font-size: 34px; font-weight: 700; margin: 0; letter-spacing: 0.5px; }
        .header .date { font-size: 13px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
        
        .admin-edit-btn {
            color: var(--ios-blue); font-size: 17px; background: none; border: none;
            padding: 0; margin: 0 0 4px 0; cursor: pointer; display: none; font-weight: 400;
        }

        /* Ana Ekleme Butonu (Apple Watch Breathe Stili) */
        .btn-container {
            margin: 40px 0; display: flex; justify-content: center; position: relative;
        }
        .btn-add {
            background: linear-gradient(180deg, #3EE066 0%, #28A745 100%);
            border: none; border-radius: 50%; width: 140px; height: 140px;
            color: white; font-size: 48px; font-weight: 300;
            box-shadow: 0 8px 32px rgba(52, 199, 89, 0.4), inset 0 2px 4px rgba(255,255,255,0.4);
            cursor: pointer; position: relative; z-index: 10;
            transition: transform 0.15s cubic-bezier(0.2, 0, 0, 1);
            display: flex; justify-content: center; align-items: center;
        }
        .btn-add:active { transform: scale(0.9); box-shadow: 0 4px 16px rgba(52, 199, 89, 0.3); }
        
        /* Buton etrafındaki atan halkalar */
        .pulse-ring {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 140px; height: 140px; border-radius: 50%;
            background: rgba(52, 199, 89, 0.2); z-index: 1;
            animation: pulse 3s infinite cubic-bezier(0.215, 0.61, 0.355, 1);
        }
        .pulse-ring:nth-child(2) { animation-delay: 1.5s; }
        @keyframes pulse {
            0% { width: 140px; height: 140px; opacity: 1; }
            100% { width: 220px; height: 220px; opacity: 0; }
        }

        /* iOS Liste (Grouped Style) */
        .list-container {
            width: 100%; max-width: 400px;
            background: var(--card-bg); border-radius: 20px;
            overflow: hidden; margin-bottom: 30px;
        }
        
        .list-row {
            display: flex; align-items: center; padding: 16px 20px;
            position: relative; transition: transform 0.3s ease;
        }
        .list-row:not(:last-child)::after {
            content: ''; position: absolute; bottom: 0; left: 60px; right: 0;
            height: 0.5px; background: var(--separator);
        }

        .rank-badge {
            width: 32px; height: 32px; border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            font-size: 16px; margin-right: 14px; flex-shrink: 0;
        }
        .rank-first { background: rgba(255, 59, 48, 0.15); color: var(--ios-red); }
        .rank-last { background: rgba(52, 199, 89, 0.15); color: var(--ios-green); }
        .rank-mid { background: rgba(235, 235, 245, 0.1); color: #fff; }

        .row-content { flex-grow: 1; display: flex; flex-direction: column; justify-content: center; }
        .row-name { font-size: 17px; font-weight: 600; letter-spacing: -0.4px; }
        .row-quote { font-size: 13px; color: var(--text-muted); margin-top: 2px; }
        
        .row-stats { display: flex; flex-direction: column; align-items: flex-end; }
        .row-score { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
        .row-cost { font-size: 11px; color: var(--ios-red); font-weight: 500; margin-top: 2px; }

        /* Admin Düzenleme Modu Araçları */
        .admin-tools {
            position: absolute; right: -120px; height: 100%; top: 0;
            display: flex; align-items: center; gap: 5px; opacity: 0;
            transition: all 0.3s ease; background: var(--card-bg); padding: 0 15px;
        }
        .edit-mode .list-row { transform: translateX(-120px); }
        .edit-mode .admin-tools { opacity: 1; }
        
        .tool-btn {
            width: 40px; height: 40px; border-radius: 50%; border: none;
            display: flex; justify-content: center; align-items: center;
            color: white; font-size: 18px; cursor: pointer;
        }
        .tool-sub { background: var(--ios-orange); }
        .tool-del { background: var(--ios-red); }

        /* iOS Modallar (Giriş ve Patron Paneli) */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.4); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            display: flex; justify-content: center; align-items: center; z-index: 1000;
        }
        .modal-card {
            background: rgba(28, 28, 30, 0.85); border-radius: 24px;
            width: 90%; max-width: 340px; padding: 24px; text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1);
        }
        .modal-card h2 { margin: 0 0 8px 0; font-size: 22px; font-weight: 600; }
        .modal-card p { color: var(--text-muted); font-size: 14px; margin: 0 0 20px 0; }
        .modal-input {
            width: 100%; background: #000; border: 1px solid var(--separator);
            color: #fff; padding: 14px; border-radius: 12px; font-size: 17px;
            margin-bottom: 16px; outline: none; text-align: center;
        }
        .modal-input:focus { border-color: var(--ios-blue); }
        .modal-btn {
            width: 100%; background: var(--ios-blue); color: white; border: none;
            padding: 14px; border-radius: 12px; font-size: 17px; font-weight: 600; cursor: pointer;
        }

        /* Patron Söz Paneli (Alttan Çıkan iOS Sheet) */
        #adminSheet {
            position: fixed; bottom: -100%; left: 0; width: 100%;
            background: var(--card-bg); border-radius: 20px 20px 0 0;
            padding: 24px; z-index: 999; transition: bottom 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 -10px 40px rgba(0,0,0,0.5); border-top: 1px solid rgba(255,255,255,0.1);
        }
        #adminSheet.active { bottom: 0; }
        .sheet-handle {
            width: 40px; height: 5px; background: var(--separator);
            border-radius: 3px; margin: 0 auto 20px auto;
        }
        .sheet-label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 4px; display: block; }
        .sheet-textarea {
            width: 100%; height: 50px; background: #000; color: #fff; border: 1px solid var(--separator);
            border-radius: 10px; padding: 10px; font-size: 14px; margin-bottom: 15px; resize: none; outline: none;
        }

    </style>
</head>
<body>
    <div class="ambient-glow"></div>

    <!-- Giriş Modalı -->
    <div id="loginModal" class="modal-overlay">
        <div class="modal-card">
            <h2>Sayaca Katıl</h2>
            <p>Grupta görüneceğin ismi yaz</p>
            <input type="text" id="nameInput" class="modal-input" placeholder="Adın nedir?" autocomplete="off" maxlength="15">
            <button class="modal-btn" onclick="saveName()">Giriş Yap</button>
        </div>
    </div>

    <div class="header">
        <div>
            <div class="date" id="dateText">Pazartesi</div>
            <h1>Günlük Özet</h1>
        </div>
        <button class="admin-edit-btn" id="editBtn" onclick="toggleEditMode()">Düzenle</button>
    </div>

    <div class="btn-container">
        <div class="pulse-ring"></div>
        <div class="pulse-ring"></div>
        <button class="btn-add" id="mainBtn" onclick="addSmoke()">+1</button>
    </div>

    <div class="list-container" id="leaderboard">
        <div style="padding: 20px; text-align: center; color: var(--text-muted);">Senkronize ediliyor...</div>
    </div>

    <!-- Patron Söz Yönetim Paneli (Sheet) -->
    <div id="adminSheet">
        <div class="sheet-handle" onclick="toggleSheet()"></div>
        <h3 style="margin: 0 0 15px 0; font-size: 20px;">Sözleri Yönet</h3>
        <label class="sheet-label">En Çok İçen Sözleri</label>
        <textarea id="editMax" class="sheet-textarea"></textarea>
        
        <label class="sheet-label">Ortalama İçen Sözleri</label>
        <textarea id="editMid" class="sheet-textarea"></textarea>
        
        <label class="sheet-label">En Az İçen Sözleri</label>
        <textarea id="editMin" class="sheet-textarea"></textarea>
        
        <button class="modal-btn" style="background: var(--ios-green);" onclick="saveQuotes()">Değişiklikleri Kaydet</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
        import { getDatabase, ref, onValue, runTransaction, set, get, remove } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA2-rUtVFadlncw_TPBK53qiLMVKhYKa6k",
            authDomain: "sayac-82f63.firebaseapp.com",
            databaseURL: "https://sayac-82f63-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "sayac-82f63"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const countersRef = ref(db, "counters");
        const quotesRef = ref(db, "quotes");

        // Fiyatlandırma sabiti (1 birim = 4 TL)
        const COST_PER_ITEM = 4;

        // Tarih Yazısı
        const days = ['Pazar', 'Pazartesi', 'Salı', 'Çarşamba', 'Perşembe', 'Cuma', 'Cumartesi'];
        document.getElementById('dateText').innerText = days[new Date().getDay()];

        // Gizli yönetici kontrolü
        const urlParams = new URLSearchParams(window.location.search);
        const isAdmin = urlParams.get('admin') === 'patron';
        let isEditMode = false;

        if (isAdmin) {
            document.getElementById('editBtn').style.display = 'block';
        }

        window.toggleEditMode = function() {
            isEditMode = !isEditMode;
            document.getElementById('editBtn').innerText = isEditMode ? 'Bitti' : 'Düzenle';
            document.getElementById('leaderboard').classList.toggle('edit-mode');
            if(isEditMode) document.getElementById('adminSheet').classList.add('active');
            else document.getElementById('adminSheet').classList.remove('active');
        };
        window.toggleSheet = function() { document.getElementById('adminSheet').classList.remove('active'); };

        let quotesMax = ["Oksijen yerine duman 🏭"];
        let quotesMin = ["Ciğerler tertemiz 🌸"];
        let quotesMid = ["Dengeyi koruyor ⚖️"];

        let myName = localStorage.getItem("sayac_ios_name");
        let usersData = {};

        function sanitizeKey(name) { return name.replace(/[.#$[\]/]/g, "_"); }

        if (myName) {
            document.getElementById("loginModal").style.display = "none";
        }

        onValue(quotesRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                if (data.max) quotesMax = data.max;
                if (data.min) quotesMin = data.min;
                if (data.mid) quotesMid = data.mid;
            } else {
                set(quotesRef, { max: quotesMax, min: quotesMin, mid: quotesMid });
            }
            if (isAdmin) {
                document.getElementById('editMax').value = quotesMax.join('\n');
                document.getElementById('editMin').value = quotesMin.join('\n');
                document.getElementById('editMid').value = quotesMid.join('\n');
            }
            renderLeaderboard();
        });

        window.saveQuotes = function() {
            let max = document.getElementById('editMax').value.split('\n').filter(q => q.trim());
            let min = document.getElementById('editMin').value.split('\n').filter(q => q.trim());
            let mid = document.getElementById('editMid').value.split('\n').filter(q => q.trim());
            set(quotesRef, { max, min, mid }).then(() => toggleSheet());
        };

        window.saveName = async function() {
            const input = document.getElementById("nameInput").value.trim();
            if (input.length > 0) {
                myName = input;
                localStorage.setItem("sayac_ios_name", myName);
                document.getElementById("loginModal").style.display = "none";
                const userRef = ref(db, "counters/" + sanitizeKey(myName));
                const snapshot = await get(userRef);
                if (!snapshot.exists()) {
                    await set(userRef, { name: myName, count: 0, updated_at: Date.now() });
                }
            }
        };

        window.addSmoke = function() {
            if (!myName) return;
            triggerHaptic();
            const userRef = ref(db, "counters/" + sanitizeKey(myName));
            runTransaction(userRef, (currentData) => {
                if (currentData) {
                    currentData.count = (currentData.count || 0) + 1;
                    currentData.updated_at = Date.now();
                    return currentData;
                } else {
                    return { name: myName, count: 1, updated_at: Date.now() };
                }
            });
        };

        window.adminSub = function(targetName) {
            const userRef = ref(db, "counters/" + sanitizeKey(targetName));
            runTransaction(userRef, (c) => { if (c && c.count > 0) { c.count -= 1; } return c; });
            triggerHaptic();
        };

        window.adminDel = function(targetName) {
            if(confirm(targetName + " kişisini sil?")) { remove(ref(db, "counters/" + sanitizeKey(targetName))); }
        };

        function triggerHaptic() {
            if (navigator.vibrate) navigator.vibrate([15, 30, 15]);
        }

        onValue(countersRef, (snapshot) => {
            usersData = snapshot.val() || {};
            renderLeaderboard();
        });

        function renderLeaderboard() {
            const board = document.getElementById("leaderboard");
            const userList = Object.values(usersData).filter(u => u && u.name);

            if (userList.length === 0) {
                board.innerHTML = '<div style="padding: 20px; text-align: center; color: var(--text-muted);">Henüz kimse yok.</div>';
                return;
            }

            userList.sort((a, b) => (b.count || 0) - (a.count || 0));
            const maxCount = userList[0].count || 0;
            const minCount = userList[userList.length - 1].count || 0;

            board.innerHTML = "";

            userList.forEach((user, index) => {
                const count = user.count || 0;
                let quote = ""; let icon = "•"; let badgeClass = "rank-mid"; let costColor = "var(--text-muted)";

                if (userList.length > 1 && count === maxCount && count > 0) {
                    quote = quotesMax[index % quotesMax.length]; icon = "💀"; badgeClass = "rank-first"; costColor = "var(--ios-red)";
                } else if (userList.length > 1 && count === minCount) {
                    quote = quotesMin[index % quotesMin.length]; icon = "🏆"; badgeClass = "rank-last"; costColor = "var(--text-muted)";
                } else {
                    quote = quotesMid[index % quotesMid.length]; icon = "👤";
                }

                const costStr = count > 0 ? `💸 ${count * COST_PER_ITEM} ₺` : "Temiz";

                const row = document.createElement("div");
                row.className = "list-row";
                row.innerHTML = `
                    <div class="rank-badge ${badgeClass}">${icon}</div>
                    <div class="row-content">
                        <div class="row-name">${user.name}</div>
                        <div class="row-quote">${quote}</div>
                    </div>
                    <div class="row-stats">
                        <div class="row-score">${count}</div>
                        <div class="row-cost" style="color: ${costColor}">${costStr}</div>
                    </div>
                    <div class="admin-tools">
                        <button class="tool-btn tool-sub" onclick="adminSub('${user.name}')">-</button>
                        <button class="tool-btn tool-del" onclick="adminDel('${user.name}')">🗑</button>
                    </div>
                `;
                board.appendChild(row);
            });
        }
    </script>
</body>
</html>
