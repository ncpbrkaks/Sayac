<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sayacımız</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }
        
        /* Arka plan duman efekti */
        .smoke-bg {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: radial-gradient(circle at 50% 50%, #2a2a2a 0%, #121212 100%);
            opacity: 0.6; z-index: -1;
        }

        h1 { color: #4CAF50; font-size: 26px; margin-bottom: 5px; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        
        .btn-add {
            background: linear-gradient(135deg, #4CAF50, #1b5e20);
            border: 2px solid #81c784;
            border-radius: 50%;
            width: 160px; height: 160px;
            color: white; font-size: 50px; font-weight: bold;
            margin: 30px 0; cursor: pointer;
            box-shadow: 0 0 30px rgba(76, 175, 80, 0.4);
            transition: all 0.1s;
            position: relative;
        }
        .btn-add:active { transform: scale(0.90); box-shadow: 0 0 10px rgba(76, 175, 80, 0.8); }
        
        .leaderboard {
            width: 100%; max-width: 400px;
            background-color: rgba(30, 30, 30, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 15px; border: 1px solid #333;
            padding: 15px; box-sizing: border-box; text-align: left;
        }
        
        .user-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 10px; border-bottom: 1px solid #333;
            border-radius: 8px; transition: all 0.3s ease;
            margin-bottom: 5px;
        }
        .user-row:last-child { border-bottom: none; margin-bottom: 0; }
        
        /* Birinci ve Sonuncu Efektleri */
        .rank-first { 
            background: rgba(255, 60, 0, 0.15); 
            border-left: 4px solid #ff3c00;
            animation: pulseFire 2s infinite;
        }
        .rank-last {
            background: rgba(76, 175, 80, 0.15);
            border-left: 4px solid #4CAF50;
        }

        @keyframes pulseFire {
            0% { box-shadow: inset 0 0 0px rgba(255, 60, 0, 0); }
            50% { box-shadow: inset 0 0 15px rgba(255, 60, 0, 0.3); }
            100% { box-shadow: inset 0 0 0px rgba(255, 60, 0, 0); }
        }

        .user-info { display: flex; flex-direction: column; }
        .user-name { font-size: 19px; font-weight: bold; display: flex; align-items: center; gap: 8px;}
        .user-quote { font-size: 13px; color: #bbb; margin-top: 5px; font-style: italic; }
        .user-score { font-size: 28px; font-weight: 900; }
        
        /* Birinci ve Sonuncu Skor Renkleri */
        .rank-first .user-score { color: #ff5722; text-shadow: 0 0 10px rgba(255,87,34,0.5); }
        .rank-last .user-score { color: #81c784; }
        
        /* Modal Stilleri */
        #nameModal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10,10,10,0.95); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 1000;
        }
        #nameModal input {
            padding: 15px; font-size: 18px; border-radius: 10px; border: none;
            width: 80%; max-width: 300px; text-align: center; margin-bottom: 20px;
            background: #222; color: white; border: 2px solid #4CAF50;
        }
        #nameModal button {
            padding: 15px 40px; font-size: 18px; border-radius: 10px; border: none;
            background: linear-gradient(135deg, #4CAF50, #2E7D32); color: white; 
            font-weight: bold; cursor: pointer; box-shadow: 0 5px 15px rgba(76, 175, 80, 0.4);
        }

        /* Duman Animasyonu İçin Ekranda Uçuşan Objeler */
        .floating-emoji {
            position: absolute; font-size: 30px; pointer-events: none;
            animation: floatUp 1.5s ease-out forwards; z-index: 50;
        }
        @keyframes floatUp {
            0% { transform: translateY(0) scale(1) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-150px) scale(1.5) rotate(20deg); opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="smoke-bg"></div>

    <div id="nameModal">
        <h2 style="color:white; margin-bottom:5px;">Ekibe Katıl</h2>
        <p style="color:#aaa; margin-bottom:25px;">Sisteme giriş için adını yaz</p>
        <input type="text" id="nameInput" placeholder="İsminizi girin..." autocomplete="off">
        <button onclick="saveName()">Baskına Başla</button>
    </div>

    <h1>🚬 Günlük Sayaç</h1>
    <p style="color:#aaa; font-size:13px; margin:0;">Sonuçlar anlık güncellenir</p>

    <button class="btn-add" id="mainBtn" onclick="addSmoke()">+1</button>

    <div class="leaderboard" id="leaderboard">
        <p style="text-align:center; color:#888;">Veriler buluttan çekiliyor...</p>
    </div>

    <script>
        const quotesMax = [
            "Yakında egzoz muayenesine girecek 🚗💨", 
            "Ciğerleri poşet gibi oldu 🖤", 
            "Marlboro'nun gizli sponsoru 💸",
            "Yürüyen baca fabrikası 🏭",
            "Nefes almayı unuttu 😮‍💨"
        ];
        const quotesMin = [
            "Alet cam gibi maşallah 💎", 
            "Sağlıklı yaşam gurusu 🧘‍♂️", 
            "Ciğerler pembe pembe 🌸",
            "Deterjanla yıkanmış gibi 🧼",
            "Ortamın en temizi ✨"
        ];
        const quotesMid = [
            "Kendi halinde, ne az ne çok ⚖️", 
            "Dengeyi bulmuş 🧘", 
            "Sessiz ve derinden 🚬",
            "Keyifçi tayfadan ☕"
        ];

        let myName = localStorage.getItem('sayac_name_v3');
        let usersData = {};

        if (myName) {
            document.getElementById('nameModal').style.display = 'none';
        }

        async function postCounter(action) {
            const res = await fetch('/api/counter', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: myName, action: action })
            });
            if (!res.ok) throw new Error('Sunucu hatası');
            const row = await res.json();
            usersData[row.name] = { count: row.count };
            renderLeaderboard();
        }

        async function saveName() {
            const input = document.getElementById('nameInput').value.trim().slice(0, 30);
            if (input.length > 0) {
                myName = input;
                localStorage.setItem('sayac_name_v3', myName);
                document.getElementById('nameModal').style.display = 'none';

                // Kullanıcı yoksa 0 ile oluşturulur, varsa sayısı korunur
                try { await postCounter('join'); } catch (e) { console.error(e); }
            }
        }

        function createFloatingEmoji() {
            const btn = document.getElementById('mainBtn');
            const rect = btn.getBoundingClientRect();
            const emoji = document.createElement('div');
            emoji.className = 'floating-emoji';
            emoji.innerText = '💨';
            
            const randomX = rect.left + (Math.random() * rect.width);
            const randomY = rect.top + (Math.random() * 20);
            
            emoji.style.left = randomX + 'px';
            emoji.style.top = randomY + 'px';
            document.body.appendChild(emoji);
            
            setTimeout(() => { emoji.remove(); }, 1500);
        }

        async function addSmoke() {
            if (!myName) return;
            createFloatingEmoji();
            if (navigator.vibrate) navigator.vibrate([50, 50, 50]);

            try {
                await postCounter('increment');
            } catch (e) {
                console.error(e);
                alert('Bağlantı hatası, tekrar dene.');
            }
        }

        async function loadCounters() {
            try {
                const res = await fetch('/api/counter', { cache: 'no-store' });
                if (!res.ok) return;
                const rows = await res.json();
                usersData = {};
                rows.forEach(row => { usersData[row.name] = { count: row.count }; });
                renderLeaderboard();
            } catch (e) {
                console.error(e);
            }
        }

        // Herkesin tıklamalarını görmek için listeyi düzenli olarak yenile
        loadCounters();
        setInterval(() => {
            if (!document.hidden) loadCounters();
        }, 2500);
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) loadCounters();
        });

        function renderLeaderboard() {
            const board = document.getElementById('leaderboard');
            
            const sortedUsers = Object.keys(usersData).map(name => {
                return { name: name, count: usersData[name].count };
            }).sort((a, b) => b.count - a.count);

            if (sortedUsers.length === 0) {
                board.innerHTML = '<p style="text-align:center; color:#888;">Henüz kimse yok. İlk sen bas!</p>';
                return;
            }

            const maxCount = sortedUsers[0].count;
            const minCount = sortedUsers[sortedUsers.length - 1].count;

            board.innerHTML = '';

            sortedUsers.forEach((user, index) => {
                let quote = "";
                let icon = "";
                let rowClass = "user-row";

                if (user.count === maxCount && user.count > 0 && sortedUsers.length > 1) {
                    quote = quotesMax[index % quotesMax.length]; 
                    icon = "🔥💀";
                    rowClass += " rank-first";
                } else if (user.count === minCount && user.count >= 0 && sortedUsers.length > 1) {
                    quote = quotesMin[index % quotesMin.length];
                    icon = "🌱";
                    rowClass += " rank-last";
                } else {
                    quote = quotesMid[index % quotesMid.length];
                    icon = "🚬";
                }

                const row = document.createElement('div');
                row.className = rowClass;
                const info = document.createElement('div');
                info.className = 'user-info';
                const nameEl = document.createElement('div');
                nameEl.className = 'user-name';
                nameEl.textContent = `${icon} ${user.name}`;
                const quoteEl = document.createElement('div');
                quoteEl.className = 'user-quote';
                quoteEl.textContent = quote;
                info.append(nameEl, quoteEl);
                const scoreEl = document.createElement('div');
                scoreEl.className = 'user-score';
                scoreEl.textContent = user.count;
                row.append(info, scoreEl);
                board.appendChild(row);
            });
        }
    </script>
</body>
</html>
