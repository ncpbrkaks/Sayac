<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Sayaç</title>
    <style>
        :root {
            --bg-color: #000000; --card-bg: #1C1C1E; --text-main: #FFFFFF;
            --text-muted: rgba(235, 235, 245, 0.6); --ios-green: #32D74B;
            --ios-red: #FF453A; --ios-blue: #0A84FF; --separator: rgba(84, 84, 88, 0.65);
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
            background-color: var(--bg-color); color: var(--text-main); margin: 0;
            padding: env(safe-area-inset-top) 20px env(safe-area-inset-bottom) 20px;
            display: flex; flex-direction: column; align-items: center; min-height: 100vh; overflow-x: hidden;
        }

        .header { width: 100%; max-width: 400px; display: flex; justify-content: space-between; align-items: flex-end; margin-top: 10px; padding-bottom: 15px; }
        .header h1 { font-size: 34px; font-weight: 700; margin: 0; letter-spacing: 0.5px; }
        .header .date { font-size: 13px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
        .admin-edit-btn { color: var(--ios-blue); font-size: 17px; background: none; border: none; padding: 0; margin: 0 0 4px 0; cursor: pointer; display: none; font-weight: 400; }

        .btn-container { margin: 20px 0 30px 0; display: flex; justify-content: center; }
        .btn-add {
            background: linear-gradient(145deg, #2a2a2c, #1c1c1e); border: 1px solid rgba(255,255,255,0.05);
            border-radius: 50%; width: 140px; height: 140px; color: var(--ios-green); font-size: 52px; font-weight: 300;
            box-shadow: 20px 20px 60px rgba(0,0,0,0.5), -10px -10px 30px rgba(255,255,255,0.03);
            cursor: pointer; transition: all 0.15s; display: flex; justify-content: center; align-items: center;
        }
        .btn-add:active { transform: scale(0.94); color: rgba(50, 215, 75, 0.5); }

        .segmented-control {
            display: flex; background: rgba(118, 118, 128, 0.24); border-radius: 8px;
            padding: 2px; width: 100%; max-width: 400px; margin-bottom: 20px;
        }
        .seg-btn {
            flex: 1; text-align: center; padding: 6px 0; font-size: 13px; font-weight: 600;
            color: var(--text-main); border: none; background: transparent; border-radius: 6px;
            cursor: pointer; transition: 0.2s;
        }
        .seg-btn.active { background: #636366; box-shadow: 0 3px 8px rgba(0,0,0,0.12); }

        .list-container { width: 100%; max-width: 400px; background: var(--card-bg); border-radius: 12px; overflow: hidden; margin-bottom: 20px; }
        .list-row { display: flex; align-items: center; padding: 14px 16px; position: relative; transition: transform 0.3s; background: var(--card-bg); cursor: pointer; }
        .list-row:not(:last-child)::after { content: ''; position: absolute; bottom: 0; left: 54px; right: 0; height: 0.5px; background: var(--separator); }
        .list-row:active { background: #2C2C2E; }
        
        .rank-badge { width: 30px; height: 30px; border-radius: 8px; display: flex; justify-content: center; align-items: center; font-size: 16px; margin-right: 14px; background: #2C2C2E; flex-shrink: 0; }
        .rank-first .rank-badge { background: var(--ios-red); color: white; }
        .rank-last .rank-badge { background: var(--ios-green); color: white; }

        .row-content { flex-grow: 1; display: flex; flex-direction: column; justify-content: center; padding-right: 10px; }
        .row-name { font-size: 17px; font-weight: 500; line-height: 1.3; display: flex; align-items: center; }
        .inline-badges { font-size: 13px; margin-left: 6px; letter-spacing: 1px; }
        .row-quote { font-size: 13px; color: var(--text-muted); margin-top: 2px; line-height: 1.2; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        
        .row-stats { display: flex; flex-direction: column; align-items: flex-end; min-width: 45px; }
        .row-score { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
        .row-cost { font-size: 12px; color: var(--ios-red); font-weight: 500; margin-top: 2px; }
        .rank-last .row-cost { color: var(--text-muted); }

        /* Daraltılmış Admin Araçları (Taşmayı önler) */
        .admin-tools { position: absolute; right: -180px; height: 100%; top: 0; display: flex; align-items: center; opacity: 0; transition: all 0.3s; background: var(--card-bg); }
        .edit-mode .list-row { transform: translateX(-180px); }
        .edit-mode .admin-tools { opacity: 1; right: 0; }
        .tool-btn { height: 100%; width: 45px; border: none; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; cursor: pointer; font-size: 11px; font-weight: 600; gap: 4px; padding: 0;}
        .tool-add { background: var(--ios-blue); } .tool-sub { background: #FF9F0A; } .tool-zero { background: #8E8E93; } .tool-del { background: var(--ios-red); }

        .admin-add-user {
            display: none; width: 100%; max-width: 400px; padding: 14px;
            background: rgba(10, 132, 255, 0.1); color: var(--ios-blue);
            border: 1px dashed var(--ios-blue); border-radius: 12px;
            text-align: center; font-size: 16px; font-weight: 600; cursor: pointer; margin-bottom: 30px;
        }

        .sheet-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.5); z-index: 100; opacity: 0; pointer-events: none; transition: 0.3s; }
        .sheet-overlay.active { opacity: 1; pointer-events: auto; }
        .bottom-sheet { position: fixed; bottom: -100%; left: 0; width: 100%; background: #1C1C1E; border-radius: 24px 24px 0 0; z-index: 101; transition: bottom 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); display: flex; flex-direction: column; max-height: 90vh; }
        .bottom-sheet.active { bottom: 0; }
        .sheet-handle { width: 40px; height: 5px; background: #555; border-radius: 3px; margin: 12px auto; }
        .sheet-header { padding: 10px 20px 20px; text-align: center; border-bottom: 1px solid var(--separator); }
        .sheet-header h2 { margin: 0; font-size: 24px; font-weight: 700; }
        .sheet-header p { margin: 5px 0 0 0; font-size: 14px; color: var(--text-muted); font-style: italic; }
        
        .stat-grid { display: flex; justify-content: space-between; padding: 20px; background: #000; }
        .stat-box { flex: 1; text-align: center; }
        .stat-value { font-size: 24px; font-weight: 700; color: var(--ios-red); margin-bottom: 4px; }
        .stat-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; font-weight: 600; }

        .content-scroll { overflow-y: auto; padding-bottom: 30px; }
        
        .badge-list { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 20px 20px; }
        .badge-item { background: #121212; border: 1px solid #333; border-radius: 12px; padding: 10px; display: flex; align-items: center; gap: 10px; width: calc(50% - 4px); }
        .badge-icon { font-size: 24px; }
        .badge-info { display: flex; flex-direction: column; }
        .badge-title { font-size: 12px; font-weight: 600; color: #fff; }
        .badge-desc { font-size: 10px; color: var(--text-muted); line-height: 1.2; margin-top: 2px;}

        .advanced-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 0 20px 20px; }
        .adv-card { background: #121212; border-radius: 16px; padding: 16px; border: 1px solid #292929; }
        .adv-icon { font-size: 22px; margin-bottom: 8px; }
        .adv-title { font-size: 12px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; }
        .adv-value { font-size: 17px; font-weight: 700; color: #fff; margin: 4px 0; line-height: 1.2; }
        .adv-sub { font-size: 12px; color: var(--ios-blue); font-weight: 500; }

        .log-container { padding: 0 20px; }
        .section-title { font-size: 16px; font-weight: 600; color: #fff; margin: 15px 20px 10px; }
        .log-item { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--separator); font-size: 14px; }
        .log-time { color: var(--text-main); font-variant-numeric: tabular-nums; }
        .log-gap { color: var(--text-muted); font-size: 12px; }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.7); backdrop-filter: blur(10px); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .modal-card { background: #1C1C1E; border-radius: 14px; width: 270px; text-align: center; overflow: hidden; }
        .modal-card-content { padding: 20px; }
        .modal-card h2 { margin: 0 0 6px 0; font-size: 18px; font-weight: 600; }
        .modal-input { width: 100%; background: #000; border: 1px solid rgba(255,255,255,0.1); color: #fff; padding: 10px; border-radius: 6px; font-size: 15px; outline: none; text-align: center; margin-top: 15px; }
        .modal-btn { width: 100%; background: transparent; color: var(--ios-blue); border: none; border-top: 0.5px solid rgba(84, 84, 88, 0.65); padding: 14px; font-size: 17px; font-weight: 600; cursor: pointer; }
    </style>
</head>
<body>
    <div id="loginModal" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-card-content">
                <h2>Sayaca Katıl</h2>
                <input type="text" id="nameInput" class="modal-input" placeholder="Adın nedir?" autocomplete="off" maxlength="15">
            </div>
            <button class="modal-btn" onclick="saveName()">Giriş Yap</button>
        </div>
    </div>

    <div class="header">
        <div>
            <div class="date" id="dateText">Pazartesi</div>
            <h1>Tüketim Raporu</h1>
        </div>
        <button class="admin-edit-btn" id="editBtn" onclick="toggleEditMode()">Düzenle</button>
    </div>

    <div class="segmented-control">
        <button class="seg-btn active" id="tabDaily" onclick="setTab('daily')">Günlük Bilanço</button>
        <button class="seg-btn" id="tabWeekly" onclick="setTab('weekly')">Haftalık Utanç Tablosu</button>
    </div>

    <div class="btn-container">
        <button class="btn-add" id="mainBtn" onclick="addSmoke()">+1</button>
    </div>

    <div class="list-container" id="leaderboard">
        <div style="padding: 20px; text-align: center; color: var(--text-muted); font-size: 14px;">Veriler yükleniyor...</div>
    </div>

    <button class="admin-add-user" id="adminAddUserBtn" onclick="adminCreateUser()">+ Yeni Kullanıcı Ekle (Patron Özel)</button>

    <!-- Kişisel Bilanço Sheet -->
    <div class="sheet-overlay" id="sheetOverlay" onclick="closeSheet()"></div>
    <div class="bottom-sheet" id="userSheet">
        <div class="sheet-handle"></div>
        <div class="sheet-header">
            <h2 id="sheetName">İsim</h2>
            <p id="sheetQuote">Söz</p>
        </div>
        <div class="content-scroll">
            <div class="stat-grid">
                <div class="stat-box">
                    <div class="stat-value" id="sheetTodayCost">0 ₺</div>
                    <div class="stat-label">Bugünkü Zarar</div>
                </div>
                <div class="stat-box" style="border-left: 1px solid #333; border-right: 1px solid #333;">
                    <div class="stat-value" id="sheetWeekCount">0</div>
                    <div class="stat-label">Haftalık Adet</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="sheetTotalCost">0 ₺</div>
                    <div class="stat-label">Toplam Zarar</div>
                </div>
            </div>

            <!-- ROZETLER BÖLÜMÜ -->
            <div class="section-title" id="badgeTitle" style="display:none;">Kazanılan Rozetler</div>
            <div class="badge-list" id="sheetBadges"></div>

            <div class="section-title">Sağlık ve Alışkanlık Analizi</div>
            <div class="advanced-stats" id="advancedStats"></div>

            <div class="section-title">Bugünkü Zaman Çizelgesi</div>
            <div class="log-container" id="logList"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
        import { getDatabase, ref, onValue, push, set, get, remove, update } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA2-rUtVFadlncw_TPBK53qiLMVKhYKa6k",
            authDomain: "sayac-82f63.firebaseapp.com",
            databaseURL: "https://sayac-82f63-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "sayac-82f63"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const countersRef = ref(db, "counters");

        const COST_PER_ITEM = 6;
        let currentTab = 'daily';
        
        const days = ['Pazar', 'Pazartesi', 'Salı', 'Çarşamba', 'Perşembe', 'Cuma', 'Cumartesi'];
        document.getElementById('dateText').innerText = days[new Date().getDay()];

        const urlParams = new URLSearchParams(window.location.search);
        const isAdmin = urlParams.get('admin') === 'patron';
        let isEditMode = false;
        
        if (isAdmin) {
            document.getElementById('editBtn').style.display = 'block';
            document.getElementById('adminAddUserBtn').style.display = 'block';
        }

        window.toggleEditMode = function() {
            isEditMode = !isEditMode;
            document.getElementById('editBtn').innerText = isEditMode ? 'Bitti' : 'Düzenle';
            document.getElementById('leaderboard').classList.toggle('edit-mode');
        };

        window.setTab = function(tab) {
            currentTab = tab;
            document.getElementById('tabDaily').classList.toggle('active', tab === 'daily');
            document.getElementById('tabWeekly').classList.toggle('active', tab === 'weekly');
            renderLeaderboard();
        };

        let myName = localStorage.getItem("sayac_ios_v5");
        let usersData = {};
        function sanitizeKey(name) { return name.replace(/[.#$[\]/]/g, "_"); }
        if (myName) document.getElementById("loginModal").style.display = "none";

        const q0 = ["Ciğerleri Alp dağları gibi tertemiz.", "Büyük ihtimalle yalan söylüyor.", "Ortamda pasif içicilikten besleniyor.", "Sağlıklı yaşam gurusu.", "Ya unuttu ya da yemin etti, sıfır çekiyor."];
        const q1 = ["Kahvaltı niyetine bir tane yakmış garibim.", "Sadece kahve yanına eşlik etsin diye içiyor.", "Tuvalette gizli gizli bir tane tellendirmiş.", "Ağzında sadece hafif bir kül tadı var."];
        const q2 = ["Maaşın yarısı tekele gidiyor.", "Sarı diş sendromu %60 tamamlandı.", "Oksijen seviyesi İstanbul trafiği kadar tıkalı.", "Günde yarım paket, ömürden yarım sene."];
        const q3 = ["Balgamıyla dubleks ev duvarı örebilir.", "Yürüyen Çernobil, radyasyon saçıyor.", "Morgda VIP sırasını şimdiden ayırttı.", "Bir paket yetmez, ikinciye saldırdı."];
        const q4 = ["Otopsi raporu: %90 Tütün, %10 Et.", "Azrail ile kanka olmuş, okeye dönüyorlar.", "Akciğerlerini çamaşır suyuyla yıkasan açılmaz.", "Günde 2 paket! Küllükte doğmuş bir mutant."];

        const BADGES = {
            baca: { icon: "🏭", title: "Yürüyen Baca", desc: "1 saatte 4'ten fazla içme krizi" },
            zincir: { icon: "🔗", title: "Zincirleme", desc: "Söndürmeden peş peşe yakma" },
            vampir: { icon: "🦇", title: "Gece Vardiyası", desc: "Gece 00:00'dan sonra ağır mesai" },
            horoz: { icon: "🐓", title: "Erken Öten", desc: "Sabahın köründe (05-07) uyanır uyanmaz" },
            fotosentez: { icon: "🌲", title: "Fotosentez", desc: "Bugün 0 çekerek bitkiye bağladı" },
            emzik: { icon: "🍼", title: "Emzik", desc: "Ortalaması çok düşük, tatlı su tiryakisi" },
            vip: { icon: "💸", title: "VIP Sponsor", desc: "Haftanın en çok para harcayanı" },
            yuz: { icon: "💀", title: "100 Kulübü", desc: "100 barajını aştı, organlar iptal" }
        };

        function getRandomQuote(count) {
            let pool = count === 0 ? q0 : count <= 5 ? q1 : count <= 15 ? q2 : count <= 25 ? q3 : q4;
            return pool[Math.floor(Math.random() * pool.length)];
        }

        function getStartOfToday() { const d = new Date(); d.setHours(0,0,0,0); return d.getTime(); }
        function getStartOfWeek() { 
            const d = new Date(); d.setHours(0,0,0,0);
            const day = d.getDay(); const diff = d.getDate() - day + (day === 0 ? -6 : 1);
            return new Date(d.setDate(diff)).getTime(); 
        }

        window.saveName = function() {
            const input = document.getElementById("nameInput").value.trim();
            if (input.length > 0) {
                myName = input; localStorage.setItem("sayac_ios_v5", myName);
                document.getElementById("loginModal").style.display = "none";
                update(ref(db, "counters/" + sanitizeKey(myName)), { name: myName });
            }
        };

        window.addSmoke = function() {
            if (!myName) return;
            if (navigator.vibrate) navigator.vibrate([20]);
            update(ref(db, "counters/" + sanitizeKey(myName)), { name: myName });
            const logRef = push(ref(db, "counters/" + sanitizeKey(myName) + "/logs"));
            set(logRef, Date.now());
        };

        window.adminCreateUser = async function() {
            const newName = prompt("Eklenecek kullanıcının adı nedir?");
            if (newName && newName.trim().length > 0) {
                const cleanName = newName.trim();
                const userRef = ref(db, "counters/" + sanitizeKey(cleanName));
                const snapshot = await get(userRef);
                if (!snapshot.exists()) await update(userRef, { name: cleanName });
                else alert("Bu isimde bir kullanıcı zaten var!");
            }
        };

        // KUSURSUZ DOĞAL VERİ EKLEME (12 Saatte 1 Dağıtım)
        window.adminAddMultiple = function(targetName, event) {
            event.stopPropagation();
            const amount = parseInt(prompt(`${targetName} için kaç adet eski sayı aktarılacak?`, "10"));
            if (!isNaN(amount) && amount > 0) {
                update(ref(db, "counters/" + sanitizeKey(targetName)), { name: targetName });
                
                const now = Date.now();
                // Her log arasına tam 12 saat boşluk koyuyoruz. İstatistikleri ASLA bozmaz.
                const interval = 12 * 60 * 60 * 1000; 
                
                for(let i=0; i<amount; i++) {
                    const logRef = push(ref(db, "counters/" + sanitizeKey(targetName) + "/logs"));
                    set(logRef, now - ((i + 1) * interval)); 
                }
                if (navigator.vibrate) navigator.vibrate([20]);
                alert(`Başarılı! Toplam ${amount} adet kayıt eklendi. Yansımayı ekrandaki (Tpl: ...) yazısında hemen görebilirsiniz.`);
            }
        };

        window.adminSub = function(targetName, event) {
            event.stopPropagation();
            const user = usersData[sanitizeKey(targetName)];
            if (user && user.logs) {
                const logs = Object.entries(user.logs).sort((a,b) => b[1] - a[1]); 
                if (logs.length > 0) remove(ref(db, `counters/${sanitizeKey(targetName)}/logs/${logs[0][0]}`));
            }
            if (navigator.vibrate) navigator.vibrate([20]);
        };
        window.adminZero = function(targetName, event) {
            event.stopPropagation();
            if(confirm("BUGÜNKÜ tüm kayıtlar silinsin mi?")) {
                const startOfToday = getStartOfToday();
                const user = usersData[sanitizeKey(targetName)];
                if (user && user.logs) {
                    Object.entries(user.logs).forEach(([logId, timestamp]) => {
                        if (timestamp >= startOfToday) remove(ref(db, `counters/${sanitizeKey(targetName)}/logs/${logId}`));
                    });
                }
            }
        };
        window.adminDel = function(targetName, event) {
            event.stopPropagation();
            if(confirm("Kişiyi tamamen SİL. Emin misin?")) remove(ref(db, "counters/" + sanitizeKey(targetName))); 
        };

        onValue(countersRef, (snapshot) => { usersData = snapshot.val() || {}; renderLeaderboard(); });

        function processUserData(user) {
            const logsArray = user.logs ? Object.values(user.logs) : [];
            const startOfToday = getStartOfToday();
            const startOfWeek = getStartOfWeek();
            
            const todayLogs = logsArray.filter(t => t >= startOfToday).sort((a,b) => b - a);
            const weekLogs = logsArray.filter(t => t >= startOfWeek);
            const allLogs = logsArray.sort((a,b) => a - b);
            
            return {
                name: user.name,
                todayCount: todayLogs.length,
                weekCount: weekLogs.length,
                totalCount: logsArray.length,
                todayLogs: todayLogs,
                allLogs: allLogs,
                firstLogTime: allLogs.length > 0 ? allLogs[0] : Date.now()
            };
        }

        function calculateAdvancedStats(logs) {
            if (logs.length === 0) return null;
            const daysMap = {};
            logs.forEach(t => {
                const dateStr = new Date(t).toLocaleDateString('tr-TR');
                if(!daysMap[dateStr]) daysMap[dateStr] = [];
                daysMap[dateStr].push(t);
            });
            let minDay = null; let minCount = Infinity;
            for (let [date, dayLogs] of Object.entries(daysMap)) {
                if (dayLogs.length < minCount) { minCount = dayLogs.length; minDay = date; }
            }
            let maxNightDay = "Yok"; let maxNightCount = 0;
            for (let [date, dayLogs] of Object.entries(daysMap)) {
                let nightCount = dayLogs.filter(t => {
                    const h = new Date(t).getHours();
                    return h >= 0 && h < 5;
                }).length;
                if (nightCount > maxNightCount) { maxNightCount = nightCount; maxNightDay = date; }
            }
            let maxHourCount = 0; let maxHourTime = null;
            for(let i=0; i<logs.length; i++) {
                let countInHour = 1;
                for(let j=i+1; j<logs.length; j++) {
                    if (logs[j] - logs[i] <= 3600000) countInHour++; 
                    else break;
                }
                if (countInHour > maxHourCount) { maxHourCount = countInHour; maxHourTime = logs[i]; }
            }
            let chainCount = 0;
            for(let i=1; i<logs.length; i++) {
                if (logs[i] - logs[i-1] <= 900000) chainCount++; 
            }
            return { minDay, minCount, maxNightDay, maxNightCount, maxHourCount, maxHourTime, chainCount };
        }

        function calculateUserBadges(statsObj, isVip, todayLogs, totalCount, firstLogTime) {
            let badges = [];
            if (!statsObj) {
                if (totalCount === 0) badges.push('fotosentez');
                return badges;
            }
            if (statsObj.maxHourCount > 4) badges.push('baca');
            if (statsObj.chainCount >= 3) badges.push('zincir');
            if (statsObj.maxNightCount >= 4) badges.push('vampir');
            const hasEarly = todayLogs.some(t => { const h = new Date(t).getHours(); return h >= 5 && h < 7; });
            if (hasEarly) badges.push('horoz');
            if (todayLogs.length === 0 && totalCount > 0) badges.push('fotosentez');
            const daysActive = Math.max(1, (Date.now() - firstLogTime) / (1000 * 3600 * 24));
            if (daysActive > 3 && (totalCount / daysActive) <= 1.5 && todayLogs.length > 0) badges.push('emzik');
            if (isVip) badges.push('vip');
            if (totalCount >= 100) badges.push('yuz');
            return badges;
        }

        function renderLeaderboard() {
            const board = document.getElementById("leaderboard");
            const processedUsers = Object.values(usersData).filter(u => u && u.name).map(processUserData);

            if (processedUsers.length === 0) { board.innerHTML = '<div style="padding: 20px; text-align: center; color: var(--text-muted);">Kimse yok.</div>'; return; }

            const maxWeek = Math.max(...processedUsers.map(u => u.weekCount));

            processedUsers.sort((a, b) => currentTab === 'daily' ? b.todayCount - a.todayCount : b.weekCount - a.weekCount);
            board.innerHTML = "";

            processedUsers.forEach((user, index) => {
                const count = currentTab === 'daily' ? user.todayCount : user.weekCount;
                let badgeClass = "rank-mid"; let icon = `<span style="font-size:12px; font-weight:700;">${index+1}</span>`; let costColor = "var(--text-muted)";
                
                if (index === 0 && count > 0 && processedUsers.length > 1) { badgeClass = "rank-first"; icon = "💀"; costColor = "var(--ios-red)"; } 
                else if (index === processedUsers.length - 1 && processedUsers.length > 1) { badgeClass = "rank-last"; icon = "🌿"; costColor = "var(--text-muted)"; }

                const stats = calculateAdvancedStats(user.allLogs);
                const isVip = user.weekCount === maxWeek && user.weekCount > 0;
                user.earnedBadges = calculateUserBadges(stats, isVip, user.todayLogs, user.totalCount, user.firstLogTime);
                
                let badgeIconsHtml = user.earnedBadges.map(b => BADGES[b].icon).join('');

                const dynamicQuote = getRandomQuote(user.todayCount);
                const costStr = count > 0 ? `💸 ${count * COST_PER_ITEM} ₺` : "Tertemiz";

                const row = document.createElement("div"); row.className = "list-row";
                row.onclick = () => openUserSheet(user, dynamicQuote, stats);
                row.innerHTML = `
                    <div class="rank-badge ${badgeClass}">${icon}</div>
                    <div class="row-content">
                        <div class="row-name">${user.name} <span class="inline-badges">${badgeIconsHtml}</span></div>
                        <div class="row-quote">${dynamicQuote} <strong style="color: #636366; font-size: 11px;">(Tpl: ${user.totalCount})</strong></div>
                    </div>
                    <div class="row-stats"><div class="row-score">${count}</div><div class="row-cost" style="color: ${costColor}">${costStr}</div></div>
                    <div class="admin-tools">
                        <button class="tool-btn tool-add" onclick="adminAddMultiple('${user.name}', event)">+ Ekle</button>
                        <button class="tool-btn tool-sub" onclick="adminSub('${user.name}', event)">-1</button>
                        <button class="tool-btn tool-zero" onclick="adminZero('${user.name}', event)">0</button>
                        <button class="tool-btn tool-del" onclick="adminDel('${user.name}', event)">Sil</button>
                    </div>`;
                board.appendChild(row);
            });
        }

        window.openUserSheet = function(user, quote, stats) {
            if (isEditMode) return; 
            
            document.getElementById('sheetName').innerText = user.name;
            document.getElementById('sheetQuote').innerText = quote;
            document.getElementById('sheetTodayCost').innerText = (user.todayCount * COST_PER_ITEM) + " ₺";
            document.getElementById('sheetWeekCount').innerText = user.weekCount;
            document.getElementById('sheetTotalCost').innerText = (user.totalCount * COST_PER_ITEM) + " ₺";

            const badgeContainer = document.getElementById('sheetBadges');
            const badgeTitle = document.getElementById('badgeTitle');
            badgeContainer.innerHTML = '';
            if (user.earnedBadges.length > 0) {
                badgeTitle.style.display = 'block';
                user.earnedBadges.forEach(b => {
                    const badge = BADGES[b];
                    badgeContainer.innerHTML += `
                        <div class="badge-item">
                            <div class="badge-icon">${badge.icon}</div>
                            <div class="badge-info">
                                <div class="badge-title">${badge.title}</div>
                                <div class="badge-desc">${badge.desc}</div>
                            </div>
                        </div>`;
                });
            } else {
                badgeTitle.style.display = 'none';
            }

            const advContainer = document.getElementById('advancedStats');
            if (!stats) {
                advContainer.innerHTML = '<div style="grid-column: 1 / -1; text-align: center; color: var(--text-muted); font-size: 13px;">Gelişmiş analiz için henüz yeterli veri yok.</div>';
            } else {
                let hourTimeStr = "Veri yok";
                if(stats.maxHourTime) {
                    const d = new Date(stats.maxHourTime);
                    hourTimeStr = `${d.getDate()} ${d.toLocaleString('tr-TR', {month:'short'})} - ${d.toLocaleTimeString('tr-TR', {hour:'2-digit', minute:'2-digit'})}`;
                }
                advContainer.innerHTML = `
                    <div class="adv-card"><div class="adv-icon">🔥</div><div class="adv-title">Kriz Anı (1 Saatte)</div><div class="adv-value">${stats.maxHourCount} Adet</div><div class="adv-sub">${hourTimeStr}</div></div>
                    <div class="adv-card"><div class="adv-icon">🦇</div><div class="adv-title">Gece Mesaisi</div><div class="adv-value">${stats.maxNightCount} Adet</div><div class="adv-sub">${stats.maxNightDay} Gecesi</div></div>
                    <div class="adv-card"><div class="adv-icon">🚂</div><div class="adv-title">Zincirleme</div><div class="adv-value">${stats.chainCount} Kez</div><div class="adv-sub">15 dk'dan kısa arayla</div></div>
                    <div class="adv-card"><div class="adv-icon">🌱</div><div class="adv-title">İrade Günü</div><div class="adv-value">${stats.minCount} Adet</div><div class="adv-sub">${stats.minDay}</div></div>
                `;
            }

            const logList = document.getElementById('logList');
            logList.innerHTML = '';
            if (user.todayLogs.length === 0) {
                logList.innerHTML = '<div style="color: var(--text-muted); font-size: 13px;">Bugün tertemiz, log kaydı yok.</div>';
            } else {
                user.todayLogs.forEach((timestamp, i) => {
                    const date = new Date(timestamp);
                    const timeStr = date.toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
                    let gapStr = '';
                    if (i < user.todayLogs.length - 1) {
                        const diffMins = Math.floor((timestamp - user.todayLogs[i + 1]) / 60000);
                        gapStr = diffMins < 60 ? `${diffMins} dk arayla` : `${Math.floor(diffMins/60)} sa ${diffMins%60} dk arayla`;
                    } else { gapStr = "Günün ilki"; }
                    logList.innerHTML += `<div class="log-item"><span class="log-time">🚬 ${timeStr}</span><span class="log-gap">${gapStr}</span></div>`;
                });
            }

            document.getElementById('sheetOverlay').classList.add('active');
            document.getElementById('userSheet').classList.add('active');
        };

        window.closeSheet = function() {
            document.getElementById('sheetOverlay').classList.remove('active');
            document.getElementById('userSheet').classList.remove('active');
        };
    </script>
</body>
</html>
