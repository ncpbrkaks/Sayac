<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Sayaç</title>
    <style>
        :root {
            --bg-color: #000000; --card-bg: #1C1C1E; --text-main: #FFFFFF;
            --text-muted: rgba(235, 235, 245, 0.6); --ios-green: #32D74B;
            --ios-red: #FF453A; --ios-blue: #0A84FF; --separator: rgba(84, 84, 88, 0.65);
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
            background-color: var(--bg-color); color: var(--text-main); margin: 0;
            padding: env(safe-area-inset-top) 20px env(safe-area-inset-bottom) 20px;
            display: flex; flex-direction: column; align-items: center; min-height: 100vh;
        }
        .header { width: 100%; max-width: 400px; display: flex; justify-content: space-between; align-items: flex-end; margin-top: 20px; padding-bottom: 15px; }
        .header h1 { font-size: 34px; font-weight: 700; margin: 0; }
        .header .date { font-size: 13px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; margin-bottom: 4px; }
        .admin-edit-btn { color: var(--ios-blue); font-size: 17px; background: none; border: none; padding: 0; cursor: pointer; display: none; }
        
        .btn-container { margin: 30px 0 40px 0; display: flex; justify-content: center; }
        .btn-add {
            background: linear-gradient(145deg, #2a2a2c, #1c1c1e); border: 1px solid rgba(255,255,255,0.05);
            border-radius: 50%; width: 150px; height: 150px; color: var(--ios-green); font-size: 56px; font-weight: 300;
            box-shadow: 20px 20px 60px rgba(0,0,0,0.5), -10px -10px 30px rgba(255,255,255,0.03);
            cursor: pointer; transition: all 0.15s; display: flex; justify-content: center; align-items: center;
        }
        .btn-add:active { transform: scale(0.94); color: rgba(50, 215, 75, 0.5); }

        .list-container { width: 100%; max-width: 400px; background: var(--card-bg); border-radius: 12px; overflow: hidden; }
        .list-row { display: flex; align-items: center; padding: 14px 16px; position: relative; transition: transform 0.3s ease; background: var(--card-bg); }
        .list-row:not(:last-child)::after { content: ''; position: absolute; bottom: 0; left: 54px; right: 0; height: 0.5px; background: var(--separator); }
        
        .rank-badge { width: 30px; height: 30px; border-radius: 8px; display: flex; justify-content: center; align-items: center; font-size: 16px; margin-right: 14px; background: #2C2C2E; flex-shrink: 0;}
        .rank-first .rank-badge { background: var(--ios-red); color: white; }
        .rank-last .rank-badge { background: var(--ios-green); color: white; }
        
        .row-content { flex-grow: 1; display: flex; flex-direction: column; justify-content: center; padding-right: 10px; }
        .row-name { font-size: 17px; font-weight: 500; }
        .row-quote { font-size: 13px; color: var(--text-muted); margin-top: 4px; line-height: 1.3; font-style: italic; }
        
        .row-stats { display: flex; flex-direction: column; align-items: flex-end; min-width: 45px; }
        .row-score { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
        .row-cost { font-size: 12px; color: var(--ios-red); font-weight: 500; margin-top: 2px; }
        .rank-last .row-cost { color: var(--text-muted); }

        .admin-tools { position: absolute; right: -160px; height: 100%; top: 0; display: flex; align-items: center; opacity: 0; transition: all 0.3s; background: var(--card-bg); }
        .edit-mode .list-row { transform: translateX(-160px); }
        .edit-mode .admin-tools { opacity: 1; right: 0; }
        .tool-btn { height: 100%; width: 53px; border: none; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; cursor: pointer; font-size: 12px; font-weight: 600; }
        .tool-sub { background: #FF9F0A; } .tool-zero { background: #8E8E93; } .tool-del { background: var(--ios-red); }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.6); backdrop-filter: blur(10px); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .modal-card { background: #1C1C1E; border-radius: 14px; width: 270px; text-align: center; overflow: hidden; }
        .modal-card-content { padding: 20px; }
        .modal-card h2 { margin: 0 0 6px 0; font-size: 18px; font-weight: 600; }
        .modal-card p { color: var(--text-muted); font-size: 13px; margin: 0 0 15px 0; }
        .modal-input { width: 100%; background: #000; border: 1px solid rgba(255,255,255,0.1); color: #fff; padding: 10px; border-radius: 6px; font-size: 15px; outline: none; text-align: center; }
        .modal-btn { width: 100%; background: transparent; color: var(--ios-blue); border: none; border-top: 0.5px solid rgba(84, 84, 88, 0.65); padding: 14px; font-size: 17px; font-weight: 600; cursor: pointer; }
    </style>
</head>
<body>
    <div id="loginModal" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-card-content">
                <h2>Sayaca Katıl</h2>
                <input type="text" id="nameInput" class="modal-input" placeholder="Adın nedir?" autocomplete="off" maxlength="15">
            </div>
            <button class="modal-btn" onclick="saveName()">Giriş Yap</button>
        </div>
    </div>

    <div class="header">
        <div>
            <div class="date" id="dateText"></div>
            <h1>Günlük Tüketim</h1>
        </div>
        <button class="admin-edit-btn" id="editBtn" onclick="toggleEditMode()">Düzenle</button>
    </div>

    <div class="btn-container"><button class="btn-add" id="mainBtn" onclick="addSmoke()">+1</button></div>
    <div class="list-container" id="leaderboard"><div style="padding: 20px; text-align: center; color: var(--text-muted); font-size: 14px;">Veriler yükleniyor...</div></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
        import { getDatabase, ref, onValue, runTransaction, set, get, remove } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA2-rUtVFadlncw_TPBK53qiLMVKhYKa6k",
            authDomain: "sayac-82f63.firebaseapp.com",
            databaseURL: "https://sayac-82f63-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "sayac-82f63"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const countersRef = ref(db, "counters");

        const COST_PER_ITEM = 4;
        const days = ['Pazar', 'Pazartesi', 'Salı', 'Çarşamba', 'Perşembe', 'Cuma', 'Cumartesi'];
        document.getElementById('dateText').innerText = days[new Date().getDay()];

        const urlParams = new URLSearchParams(window.location.search);
        const isAdmin = urlParams.get('admin') === 'patron';
        let isEditMode = false;
        if (isAdmin) document.getElementById('editBtn').style.display = 'block';

        window.toggleEditMode = function() {
            isEditMode = !isEditMode;
            document.getElementById('editBtn').innerText = isEditMode ? 'Bitti' : 'Düzenle';
            document.getElementById('leaderboard').classList.toggle('edit-mode');
        };

        let myName = localStorage.getItem("sayac_ios_v3");
        let usersData = {};
        function sanitizeKey(name) { return name.replace(/[.#$[\]/]/g, "_"); }
        if (myName) document.getElementById("loginModal").style.display = "none";

        window.saveName = async function() {
            const input = document.getElementById("nameInput").value.trim();
            if (input.length > 0) {
                myName = input;
                localStorage.setItem("sayac_ios_v3", myName);
                document.getElementById("loginModal").style.display = "none";
                const userRef = ref(db, "counters/" + sanitizeKey(myName));
                const snapshot = await get(userRef);
                if (!snapshot.exists()) {
                    await set(userRef, { name: myName, count: 0, quote: "Henüz temiz.", updated_at: Date.now() });
                }
            }
        };

        window.addSmoke = async function() {
            if (!myName) return;
            if (navigator.vibrate) navigator.vibrate([20]);
            
            const userRef = ref(db, "counters/" + sanitizeKey(myName));
            let newCount = 1;

            // Önce skoru artır ve yapay zeka yükleniyor mesajı koy
            await runTransaction(userRef, (currentData) => {
                if (currentData) {
                    newCount = (currentData.count || 0) + 1;
                    currentData.count = newCount;
                    currentData.quote = "Yapay zeka sana giydirmeye hazırlanıyor... ⏳";
                    currentData.updated_at = Date.now();
                    return currentData;
                }
                return { name: myName, count: 1, quote: "Yapay zeka sana giydirmeye hazırlanıyor... ⏳", updated_at: Date.now() };
            });

            // Vercel'deki Yapay Zeka API'sini çağır
            try {
                const response = await fetch('/api/ai', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: myName, count: newCount })
                });
                const data = await response.json();
                
                // Gelen lafı Firebase'e kaydet (Herkesin ekranında güncellenir)
                runTransaction(userRef, (currentData) => {
                    if (currentData) {
                        currentData.quote = data.quote || "Sistem çöktü, kurtuldun.";
                        currentData.updated_at = Date.now();
                    }
                    return currentData;
                });
            } catch (err) {
                console.error("AI Error:", err);
            }
        };

        window.adminSub = function(targetName) { runTransaction(ref(db, "counters/" + sanitizeKey(targetName)), (c) => { if (c && c.count > 0) c.count -= 1; return c; }); };
        window.adminZero = function(targetName) { if(confirm("Sıfırlansın mı?")) runTransaction(ref(db, "counters/" + sanitizeKey(targetName)), (c) => { if (c) c.count = 0; return c; }); };
        window.adminDel = function(targetName) { if(confirm("Silinecek?")) remove(ref(db, "counters/" + sanitizeKey(targetName))); };

        onValue(countersRef, (snapshot) => {
            usersData = snapshot.val() || {};
            renderLeaderboard();
        });

        function renderLeaderboard() {
            const board = document.getElementById("leaderboard");
            const userList = Object.values(usersData).filter(u => u && u.name).sort((a, b) => (b.count || 0) - (a.count || 0));
            if (userList.length === 0) { board.innerHTML = '<div style="padding: 20px; text-align: center; color: var(--text-muted);">Kimse yok.</div>'; return; }
            board.innerHTML = "";
            userList.forEach((user, index) => {
                const count = user.count || 0;
                let badgeClass = "rank-mid"; let icon = `<span style="font-size:12px; font-weight:700;">${index+1}</span>`; let costColor = "var(--text-muted)";
                if (index === 0 && count > 0 && userList.length > 1) { badgeClass = "rank-first"; icon = "💀"; costColor = "var(--ios-red)"; } 
                else if (index === userList.length - 1 && userList.length > 1) { badgeClass = "rank-last"; icon = "🌿"; costColor = "var(--text-muted)"; }

                const quoteText = user.quote || "Kendi halinde...";
                const costStr = count > 0 ? `💸 ${count * COST_PER_ITEM} ₺` : "Tertemiz";

                const row = document.createElement("div"); row.className = "list-row";
                row.innerHTML = `
                    <div class="rank-badge ${badgeClass}">${icon}</div>
                    <div class="row-content"><div class="row-name">${user.name}</div><div class="row-quote">${quoteText}</div></div>
                    <div class="row-stats"><div class="row-score">${count}</div><div class="row-cost" style="color: ${costColor}">${costStr}</div></div>
                    <div class="admin-tools">
                        <button class="tool-btn tool-sub" onclick="adminSub('${user.name}')"><span>-1</span></button>
                        <button class="tool-btn tool-zero" onclick="adminZero('${user.name}')"><span>Sıfırla</span></button>
                        <button class="tool-btn tool-del" onclick="adminDel('${user.name}')"><span>Sil</span></button>
                    </div>`;
                board.appendChild(row);
            });
        }
    </script>
</body>
</html>
