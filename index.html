<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Sayaç</title>
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #1C1C1E;
            --text-main: #FFFFFF;
            --text-muted: rgba(235, 235, 245, 0.6);
            --ios-green: #32D74B;
            --ios-red: #FF453A;
            --ios-blue: #0A84FF;
            --separator: rgba(84, 84, 88, 0.65);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: env(safe-area-inset-top) 20px env(safe-area-inset-bottom) 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .header {
            width: 100%; max-width: 400px;
            display: flex; justify-content: space-between; align-items: flex-end;
            margin-top: 20px; padding-bottom: 15px;
        }
        .header h1 { font-size: 34px; font-weight: 700; margin: 0; letter-spacing: 0.5px; }
        .header .date { font-size: 13px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
        
        .admin-edit-btn {
            color: var(--ios-blue); font-size: 17px; background: none; border: none;
            padding: 0; margin: 0 0 4px 0; cursor: pointer; display: none; font-weight: 400;
        }

        .btn-container {
            margin: 30px 0 40px 0; display: flex; justify-content: center; position: relative;
        }
        .btn-add {
            background: linear-gradient(145deg, #2a2a2c, #1c1c1e);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 50%; width: 150px; height: 150px;
            color: var(--ios-green); font-size: 56px; font-weight: 300;
            box-shadow:  20px 20px 60px rgba(0,0,0,0.5), 
                         -10px -10px 30px rgba(255,255,255,0.03),
                         inset 0 0 0 rgba(0,0,0,0);
            cursor: pointer; z-index: 10;
            transition: all 0.15s cubic-bezier(0.2, 0, 0, 1);
            display: flex; justify-content: center; align-items: center;
        }
        .btn-add:active {
            transform: scale(0.94);
            box-shadow:  5px 5px 20px rgba(0,0,0,0.5), 
                         -5px -5px 15px rgba(255,255,255,0.02),
                         inset 15px 15px 30px rgba(0,0,0,0.8);
            color: rgba(50, 215, 75, 0.5);
        }

        .list-container {
            width: 100%; max-width: 400px;
            background: var(--card-bg); border-radius: 12px;
            overflow: hidden; margin-bottom: 30px;
        }
        
        .list-row {
            display: flex; align-items: center; padding: 14px 16px;
            position: relative; transition: transform 0.3s ease;
            background: var(--card-bg);
        }
        .list-row:not(:last-child)::after {
            content: ''; position: absolute; bottom: 0; left: 54px; right: 0;
            height: 0.5px; background: var(--separator);
        }

        .rank-badge {
            width: 30px; height: 30px; border-radius: 8px;
            display: flex; justify-content: center; align-items: center;
            font-size: 16px; margin-right: 14px; flex-shrink: 0;
            background: #2C2C2E;
        }
        .rank-first .rank-badge { background: var(--ios-red); color: white; }
        .rank-last .rank-badge { background: var(--ios-green); color: white; }

        .row-content { flex-grow: 1; display: flex; flex-direction: column; justify-content: center; padding-right: 10px; }
        .row-name { font-size: 17px; font-weight: 500; letter-spacing: -0.2px; line-height: 1.3; }
        .row-quote { font-size: 13px; color: var(--text-muted); margin-top: 2px; line-height: 1.2; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        
        .row-stats { display: flex; flex-direction: column; align-items: flex-end; min-width: 45px; }
        .row-score { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
        .row-cost { font-size: 12px; color: var(--ios-red); font-weight: 500; margin-top: 2px; }
        .rank-last .row-cost { color: var(--text-muted); }

        .admin-tools {
            position: absolute; right: -160px; height: 100%; top: 0;
            display: flex; align-items: center; gap: 0; opacity: 0;
            transition: all 0.3s ease; background: var(--card-bg);
        }
        .edit-mode .list-row { transform: translateX(-160px); }
        .edit-mode .admin-tools { opacity: 1; right: 0; }
        
        .tool-btn {
            height: 100%; width: 53px; border: none; display: flex; flex-direction: column;
            justify-content: center; align-items: center; color: white; cursor: pointer; font-size: 12px; font-weight: 600; gap: 4px;
        }
        .tool-sub { background: #FF9F0A; }
        .tool-zero { background: #8E8E93; }
        .tool-del { background: var(--ios-red); }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            display: flex; justify-content: center; align-items: center; z-index: 1000;
        }
        .modal-card {
            background: #1C1C1E; border-radius: 14px; width: 270px; text-align: center; overflow: hidden;
        }
        .modal-card-content { padding: 20px; }
        .modal-card h2 { margin: 0 0 6px 0; font-size: 18px; font-weight: 600; }
        .modal-card p { color: var(--text-muted); font-size: 13px; margin: 0 0 15px 0; line-height: 1.4; }
        .modal-input {
            width: 100%; background: #000; border: 1px solid rgba(255,255,255,0.1);
            color: #fff; padding: 10px; border-radius: 6px; font-size: 15px; outline: none; text-align: center;
        }
        .modal-input:focus { border-color: var(--ios-blue); }
        .modal-btn {
            width: 100%; background: transparent; color: var(--ios-blue); border: none; border-top: 0.5px solid rgba(84, 84, 88, 0.65);
            padding: 14px; font-size: 17px; font-weight: 600; cursor: pointer;
        }
        .modal-btn:active { background: rgba(255,255,255,0.05); }

    </style>
</head>

                localStorage.setItem("sayac_ios_v4", myName);
                document.getElementById("loginModal").style.display = "none";
                const userRef = ref(db, "counters/" + sanitizeKey(myName));
                const snapshot = await get(userRef);
                if (!snapshot.exists()) {
                    await set(userRef, { name: myName, count: 0, updated_at: Date.now() });
                }
            }
        };

        function getRandomQuote(count) {
            let pool;
            if (count === 0) pool = q0;
            else if (count <= 5) pool = q1;
            else if (count <= 15) pool = q2;
            else if (count <= 25) pool = q3;
            else pool = q4;
            return pool[Math.floor(Math.random() * pool.length)];
        }

        window.addSmoke = function() {
            if (!myName) return;
            if (navigator.vibrate) navigator.vibrate([20]);
            
            const userRef = ref(db, "counters/" + sanitizeKey(myName));
            runTransaction(userRef, (currentData) => {
                if (currentData) {
                    currentData.count = (currentData.count || 0) + 1;
                    currentData.updated_at = Date.now();
                    return currentData;
                } else {
                    return { name: myName, count: 1, updated_at: Date.now() };
                }
            });
        };

        window.adminSub = function(targetName) {
            const userRef = ref(db, "counters/" + sanitizeKey(targetName));
            runTransaction(userRef, (c) => { if (c && c.count > 0) { c.count -= 1; } return c; });
            if (navigator.vibrate) navigator.vibrate([20]);
        };

        window.adminZero = function(targetName) {
            if(confirm(targetName + " skoru sıfırlansın mı?")) {
                const userRef = ref(db, "counters/" + sanitizeKey(targetName));
                runTransaction(userRef, (c) => { if (c) { c.count = 0; } return c; });
            }
        };

        window.adminDel = function(targetName) {
            if(confirm(targetName + " tamamen SİLİNECEK. Emin misin?")) { 
                remove(ref(db, "counters/" + sanitizeKey(targetName))); 
            }
        };

        onValue(countersRef, (snapshot) => {
            usersData = snapshot.val() || {};
            renderLeaderboard();
        });

        function renderLeaderboard() {
            const board = document.getElementById("leaderboard");
            const userList = Object.values(usersData).filter(u => u && u.name);

            if (userList.length === 0) {
                board.innerHTML = '<div style="padding: 20px; text-align: center; color: var(--text-muted); font-size: 14px;">Kimse eklenmemiş.</div>';
                return;
            }

            userList.sort((a, b) => (b.count || 0) - (a.count || 0));
            
            board.innerHTML = "";

            userList.forEach((user, index) => {
                const count = user.count || 0;
                let badgeClass = "rank-mid";
                let icon = `<span style="font-size:12px; font-weight:700;">${index+1}</span>`;
                let costColor = "var(--text-muted)";
                
                if (index === 0 && count > 0 && userList.length > 1) {
                    badgeClass = "rank-first"; icon = "💀"; costColor = "var(--ios-red)";
                } else if (index === userList.length - 1 && userList.length > 1) {
                    badgeClass = "rank-last"; icon = "🌿"; costColor = "var(--text-muted)";
                }

                const dynamicQuote = getRandomQuote(count);
                const costStr = count > 0 ? `💸 ${count * COST_PER_ITEM} ₺` : "Tertemiz";

                const row = document.createElement("div");
                row.className = "list-row";
                row.innerHTML = `
                    <div class="rank-badge ${badgeClass}">${icon}</div>
                    <div class="row-content">
                        <div class="row-name">${user.name}</div>
                        <div class="row-quote">${dynamicQuote}</div>
                    </div>
                    <div class="row-stats">
                        <div class="row-score">${count}</div>
                        <div class="row-cost" style="color: ${costColor}">${costStr}</div>
                    </div>
                    <div class="admin-tools">
                        <button class="tool-btn tool-sub" onclick="adminSub('${user.name}')"><span>-1</span></button>
                        <button class="tool-btn tool-zero" onclick="adminZero('${user.name}')"><span>Sıfırla</span></button>
                        <button class="tool-btn tool-del" onclick="adminDel('${user.name}')"><span>Sil</span></button>
                    </div>
                `;
                board.appendChild(row);
            });
        }
    </script>
</body>
</html>
